<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Personal Sync</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --ink: #0f172a; --muted: #475569; --accent: #0f766e; --border: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --card: #1e293b; --ink: #f1f5f9; --muted: #94a3b8; --accent: #2dd4bf; --border: #334155; }
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.65; }
    main { max-width: 640px; margin: 56px auto; padding: 0 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Personal Sync</h1>
      <p>Personal Sync는 개인용 동기화 애플리케이션입니다.</p>
      <p>Personal Sync is a private personal-use synchronization application.</p>
      <p><a href="./privacy.html">개인정보처리방침 / Privacy Policy</a></p>
    </div>
  </main>
</body>
</html>
